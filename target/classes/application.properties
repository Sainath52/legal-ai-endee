spring.application.name=LegalAI-Endee
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.legalai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Endee Vector DB Configuration (for future real integration)
endee.api.url=http://localhost:8081
endee.api.timeout=5000
endee.embedding.dimension=384

# Application Configuration
app.name=LegalAI-Endee RAG Engine
app.version=1.0.0
app.description=Retrieval Augmented Generation based Legal Search Engine
